<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<meta name="description" content="Auvra — Find your everyday. Discover, compare and shop products from multiple stores.">
<title>Auvra — Find your everyday</title>
<style>
:root{
  --pink:#ff5c9a; --pink2:#ff8fba; --ink:#25212a; --muted:#7d7480;
  --card:#fff; --bg:#fff8fb; --line:#f0e5eb; --green:#218c68;
  --shadow:0 12px 35px rgba(55,25,45,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px}
header{padding:22px 18px 14px;position:sticky;top:0;background:rgba(255,248,251,.94);backdrop-filter:blur(14px);z-index:10}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--pink)}
.tagline{font-size:11px;color:var(--muted);margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px}
.search{margin-top:16px;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:0 14px;box-shadow:var(--shadow)}
.search input{width:100%;height:48px;border:0;outline:0;background:transparent;font-size:14px}
.hero{margin:8px 18px 18px;padding:23px;border-radius:25px;background:linear-gradient(135deg,#ffe1ec,#fff);box-shadow:var(--shadow)}
.hero h1{margin:0;font-size:27px;line-height:1.08;letter-spacing:-1px}
.hero p{color:var(--muted);font-size:13px;line-height:1.5;margin:10px 0 16px}
.cta{background:var(--ink);color:#fff;padding:12px 17px;border-radius:13px;font-weight:800;font-size:13px}
.section{padding:0 18px;margin-top:22px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section h2{font-size:18px;margin:0}
.small{font-size:12px;color:var(--pink);font-weight:800}
.categories{display:flex;gap:10px;overflow:auto;padding-bottom:5px}
.categories::-webkit-scrollbar{display:none}
.cat{min-width:78px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px 8px;text-align:center}
.cat .emoji{font-size:23px;display:block;margin-bottom:4px}
.cat b{font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;position:relative;box-shadow:0 7px 20px rgba(55,25,45,.045)}
.product-img{height:145px;border-radius:15px;background:#f8f5f7;display:flex;align-items:center;justify-content:center;font-size:58px}
.wish{position:absolute;right:17px;top:17px;width:32px;height:32px;border-radius:50%;background:#fff;font-size:17px;box-shadow:0 4px 12px #00000012}
.store{font-size:10px;color:var(--muted);margin-top:9px}
.name{font-size:13px;font-weight:800;margin:4px 0;line-height:1.25}
.rating{font-size:10px;color:#a66b00}
.price{font-size:17px;font-weight:900;margin-top:5px}
.old{text-decoration:line-through;color:#aaa;font-size:11px;font-weight:500;margin-left:4px}
.compare{width:100%;margin-top:9px;padding:9px;border-radius:11px;background:#fff0f5;color:#d93b78;font-size:11px;font-weight:900}
.buy{width:100%;margin-top:6px;padding:10px;border-radius:11px;background:var(--pink);color:#fff;font-size:11px;font-weight:900}
.empty{padding:25px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav{background:none;color:#8d838d;font-size:10px;font-weight:700;text-align:center}
.nav strong{display:block;font-size:20px;margin-bottom:2px}
.nav.active{color:var(--pink)}
.modal{display:none;position:fixed;inset:0;background:#20182066;z-index:30;align-items:flex-end}
.sheet{width:min(520px,100%);background:#fff;border-radius:26px 26px 0 0;padding:20px;max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
.row b{white-space:nowrap}
.close{float:right;background:#f5f0f3;border-radius:50%;width:32px;height:32px}
.notice{font-size:10px;color:var(--muted);line-height:1.4;margin-top:12px}
@media(min-width:700px){body{padding:20px}.app{border-radius:30px;box-shadow:0 0 60px #0000000c;overflow:hidden}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div>
      <div class="logo">Auvra<span>✦</span></div>
      <div class="tagline">Find your everyday.</div>
    </div>
    <div style="display:flex;gap:8px"><button class="icon-btn" onclick="showAuth()" aria-label="Account">👤</button><button class="icon-btn" onclick="showWishlist()" aria-label="Wishlist">♡</button></div>
  </div>
  <div class="search">
    🔎 <input id="search" placeholder="Search products, brands & categories" oninput="renderProducts()">
  </div>
</header>

<main>
<section class="hero">
  <h1>Shop smarter.<br>Choose your way.</h1>
  <p>Discover products from different stores, compare options and jump to the deal you want.</p>
  <button class="cta" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Explore deals →</button>
</section>

<section class="section">
  <div class="section-head"><h2>Categories</h2><span class="small">View all</span></div>
  <div class="categories">
    <button class="cat" onclick="setCategory('Electronics')"><span class="emoji">📱</span><b>Electronics</b></button>
    <button class="cat" onclick="setCategory('Fashion')"><span class="emoji">👗</span><b>Fashion</b></button>
    <button class="cat" onclick="setCategory('Beauty')"><span class="emoji">💄</span><b>Beauty</b></button>
    <button class="cat" onclick="setCategory('Home')"><span class="emoji">🏠</span><b>Home</b></button>
    <button class="cat" onclick="setCategory('Fitness')"><span class="emoji">🏋️</span><b>Fitness</b></button>
  </div>
</section>

<section class="section" id="products">
  <div class="section-head"><h2 id="sectionTitle">Trending picks</h2><span class="small" id="count"></span></div>
  <div class="grid" id="grid"></div>
</section>
</main>

<nav class="bottom">
  <button class="nav active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><strong>⌂</strong>Home</button>
  <button class="nav" onclick="document.getElementById('search').focus();window.scrollTo({top:0,behavior:'smooth'})"><strong>⌕</strong>Search</button>
  <button class="nav" onclick="showCompare()"><strong>⇄</strong>Compare</button>
  <button class="nav" onclick="showWishlist()"><strong>♡</strong>Wishlist</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <button class="close" onclick="closeModal()">×</button>
    <h3 id="modalTitle">Compare products</h3>
    <div id="modalBody"></div>
  </div>
</div>
</div>

<script>
const products=[
 {id:1,emoji:"🎧",name:"Wireless Noise-Cancel Headphones",category:"Electronics",store:"Demo Store A",price:1999,old:2999,rating:"4.5",link:"#"},
 {id:2,emoji:"⌚",name:"Smart Fitness Watch",category:"Electronics",store:"Demo Store B",price:1499,old:2199,rating:"4.3",link:"#"},
 {id:3,emoji:"👟",name:"Everyday Comfort Sneakers",category:"Fashion",store:"Demo Store C",price:1299,old:1999,rating:"4.4",link:"#"},
 {id:4,emoji:"👜",name:"Minimal Everyday Handbag",category:"Fashion",store:"Demo Store A",price:899,old:1499,rating:"4.6",link:"#"},
 {id:5,emoji:"💡",name:"Smart LED Desk Lamp",category:"Home",store:"Demo Store B",price:799,old:1199,rating:"4.2",link:"#"},
 {id:6,emoji:"🧴",name:"Daily Skincare Starter Set",category:"Beauty",store:"Demo Store C",price:699,old:999,rating:"4.5",link:"#"},
 {id:7,emoji:"🎒",name:"Lightweight College Backpack",category:"Fashion",store:"Demo Store B",price:1099,old:1699,rating:"4.4",link:"#"},
 {id:8,emoji:"🏃",name:"Adjustable Home Workout Kit",category:"Fitness",store:"Demo Store A",price:1599,old:2299,rating:"4.3",link:"#"}
];
let category="All", compare=[], wishlist=JSON.parse(localStorage.getItem("auvraWishlist")||"[]");
let supabaseClient=null, currentUser=null;
const SUPABASE_URL="https://kdpbbledordlpjfcsvmr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="-B87hD40j410bAONXRVPw_U86YdqeC";

function supabaseReady(){
  return window.supabase &&
    SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("PASTE_") &&
    !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");
}
async function initSupabase(){
  if(!supabaseReady()) return;
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data}=await supabaseClient.auth.getSession();
  currentUser=data?.session?.user||null;
  if(currentUser) await loadCloudWishlist();
  supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
    currentUser=session?.user||null;
    if(currentUser) await loadCloudWishlist();
    renderProducts();
  });
}
async function loadCloudWishlist(){
  const {data,error}=await supabaseClient.from("Wishlist").select("Product_id").eq("User_id",currentUser.id);
  if(error){console.error(error);return;}
  wishlist=(data||[]).map(x=>Number(x.Product_id));
  localStorage.setItem("auvraWishlist",JSON.stringify(wishlist));
  renderProducts();
}
async function toggleCloudWish(id){
  const p=products.find(x=>x.id===id);
  if(!currentUser){showAuth();return;}
  if(wishlist.includes(id)){
    const {error}=await supabaseClient.from("Wishlist").delete().eq("User_id",currentUser.id).eq("Product_id",String(id));
    if(error){alert(error.message);return;}
    wishlist=wishlist.filter(x=>x!==id);
  }else{
    const {error}=await supabaseClient.from("Wishlist").insert({
      User_id:currentUser.id,Product_id:String(id),Product_name:p.name,Price:p.price,Image_url:""
    });
    if(error){alert(error.message);return;}
    wishlist=[...wishlist,id];
  }
  localStorage.setItem("auvraWishlist",JSON.stringify(wishlist));
  renderProducts();
}
async function signUp(){
  if(!supabaseClient)return alert("Add your Supabase URL and Publishable key first.");
  const email=prompt("Email:");
  if(!email)return;
  const password=prompt("Password (6+ characters):");
  if(!password)return;
  const {error}=await supabaseClient.auth.signUp({email,password});
  if(error) return alert(error.message);
  alert("Account created. Check your email if confirmation is enabled.");
}
async function login(){
  if(!supabaseClient)return alert("Add your Supabase URL and Publishable key first.");
  const email=prompt("Email:");
  if(!email)return;
  const password=prompt("Password:");
  if(!password)return;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)return alert(error.message);
  alert("Logged in successfully!");
}
async function logout(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  closeModal();
}
function showAuth(){
  document.getElementById("modalTitle").textContent=currentUser?"👤 Account":"🔐 Auvra Account";
  document.getElementById("modalBody").innerHTML=currentUser
    ? `<p>Signed in as <b>${currentUser.email||"Auvra user"}</b></p><button class="buy" onclick="logout()">Log out</button>`
    : `<p>Sign in to sync your wishlist across devices.</p><button class="buy" onclick="login()">Log in</button><button class="compare" onclick="signUp()">Create account</button>`;
  document.getElementById("modal").style.display="flex";
}

function money(n){return "₹"+n.toLocaleString("en-IN")}
function renderProducts(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=products.filter(p=>(category==="All"||p.category===category)&&(!q||(`${p.name} ${p.category} ${p.store}`).toLowerCase().includes(q)));
 document.getElementById("sectionTitle").textContent=q?`Results for "${q}"`:(category==="All"?"Trending picks":category);
 document.getElementById("count").textContent=list.length+" items";
 const grid=document.getElementById("grid");
 grid.innerHTML=list.length?list.map(card).join(""):`<div class="empty">No products found.<br>Try another search.</div>`;
}
function card(p){
 const wished=wishlist.includes(p.id);
 return `<article class="card">
   <button class="wish" onclick="toggleWish(${p.id})">${wished?"♥":"♡"}</button>
   <div class="product-img">${p.emoji}</div>
   <div class="store">${p.store} • ${p.category}</div>
   <div class="name">${p.name}</div>
   <div class="rating">★ ${p.rating} · Demo rating</div>
   <div class="price">${money(p.price)} <span class="old">${money(p.old)}</span></div>
   <button class="compare" onclick="toggleCompare(${p.id})">${compare.includes(p.id)?"✓ Added to compare":"⇄ Compare"}</button>
   <a class="buy" href="${p.link}" onclick="affiliateNotice(event,${p.id})" style="display:block;text-align:center;text-decoration:none">View deal →</a>
 </article>`;
}
function setCategory(c){category=c;renderProducts();document.getElementById("products").scrollIntoView({behavior:"smooth"})}
function toggleWish(id){
 if(supabaseClient){
   if(!currentUser){showAuth();return;}
   return toggleCloudWish(id);
 }
 wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];
 localStorage.setItem("auvraWishlist",JSON.stringify(wishlist));renderProducts();
}
function toggleCompare(id){
 if(compare.includes(id)) compare=compare.filter(x=>x!==id);
 else if(compare.length<4) compare.push(id);
 else return alert("You can compare up to 4 products.");
 renderProducts();
}
function showCompare(){
 if(!compare.length){alert("Add products using the Compare button first.");return}
 const items=products.filter(p=>compare.includes(p.id));
 document.getElementById("modalTitle").textContent="Compare selected products";
 document.getElementById("modalBody").innerHTML=items.map(p=>`<div class="row"><span>${p.emoji} ${p.name}</span><b>${money(p.price)}</b></div>`).join("")+
 `<p class="notice">Demo comparison data. Replace these products, prices and affiliate links with approved retailer/API/feed data before launch.</p>`;
 document.getElementById("modal").style.display="flex";
}
function showWishlist(){
 const items=products.filter(p=>wishlist.includes(p.id));
 document.getElementById("modalTitle").textContent="♡ Your wishlist";
 document.getElementById("modalBody").innerHTML=items.length?items.map(p=>`<div class="row"><span>${p.emoji} ${p.name}</span><b>${money(p.price)}</b></div>`).join(""):"<p>No saved products yet. Tap ♡ on a product to save it.</p>";
 document.getElementById("modal").style.display="flex";
}
function closeModal(){document.getElementById("modal").style.display="none"}
function affiliateNotice(e,id){
 if(products.find(p=>p.id===id).link==="#"){
   e.preventDefault();
   alert("Affiliate placeholder: replace this # with your approved affiliate tracking URL.");
 }
}
renderProducts();
initSupabase();
</script>
</body>
</html>
