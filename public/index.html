<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<meta name="description" content="Auvra — Find your everyday. Discover, compare and shop products from multiple stores.">
<title>Auvra — Find your everyday</title>

<style>
:root{
  --pink:#ff5c9a;
  --pink2:#ff8fba;
  --ink:#25212a;
  --muted:#7d7480;
  --card:#fff;
  --bg:#fff8fb;
  --line:#f0e5eb;
  --green:#218c68;
  --shadow:0 12px 35px rgba(55,25,45,.08);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink)
}
button,input{font:inherit}
button{cursor:pointer;border:0}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:82px
}

header{
  padding:22px 18px 14px;
  position:sticky;
  top:0;
  background:rgba(255,248,251,.94);
  backdrop-filter:blur(14px);
  z-index:10
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px
}

.logo span{color:var(--pink)}

.tagline{
  font-size:11px;
  color:var(--muted);
  margin-top:2px
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#fff;
  border:1px solid var(--line);
  font-size:18px
}

.search{
  margin-top:16px;
  display:flex;
  align-items:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:0 14px;
  box-shadow:var(--shadow)
}

.search input{
  width:100%;
  height:48px;
  border:0;
  outline:0;
  background:transparent;
  font-size:14px
}

.hero{
  margin:8px 18px 18px;
  padding:23px;
  border-radius:25px;
  background:linear-gradient(135deg,#ffe1ec,#fff);
  box-shadow:var(--shadow)
}

.hero h1{
  margin:0;
  font-size:27px;
  line-height:1.08;
  letter-spacing:-1px
}

.hero p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:10px 0 16px
}

.cta{
  background:var(--ink);
  color:#fff;
  padding:12px 17px;
  border-radius:13px;
  font-weight:800;
  font-size:13px
}

.section{
  padding:0 18px;
  margin-top:22px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}

.section h2{
  font-size:18px;
  margin:0
}

.small{
  font-size:12px;
  color:var(--pink);
  font-weight:800
}

.categories{
  display:flex;
  gap:10px;
  overflow:auto;
  padding-bottom:5px
}

.categories::-webkit-scrollbar{display:none}

.cat{
  min-width:78px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:11px 8px;
  text-align:center
}

.cat .emoji{
  font-size:23px;
  display:block;
  margin-bottom:4px
}

.cat b{font-size:11px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:10px;
  position:relative;
  box-shadow:0 7px 20px rgba(55,25,45,.045)
}

.product-img{
  height:145px;
  border-radius:15px;
  background:#f8f5f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:58px
}

.wish{
  position:absolute;
  right:17px;
  top:17px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#fff;
  font-size:17px;
  box-shadow:0 4px 12px #00000012
}

.store{
  font-size:10px;
  color:var(--muted);
  margin-top:9px
}

.name{
  font-size:13px;
  font-weight:800;
  margin:4px 0;
  line-height:1.25
}

.rating{
  font-size:10px;
  color:#a66b00
}

.price{
  font-size:17px;
  font-weight:900;
  margin-top:5px
}

.old{
  text-decoration:line-through;
  color:#aaa;
  font-size:11px;
  font-weight:500;
  margin-left:4px
}

.compare{
  width:100%;
  margin-top:9px;
  padding:9px;
  border-radius:11px;
  background:#fff0f5;
  color:#d93b78;
  font-size:11px;
  font-weight:900
}

.buy{
  width:100%;
  margin-top:6px;
  padding:10px;
  border-radius:11px;
  background:var(--pink);
  color:#fff;
  font-size:11px;
  font-weight:900
}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
  background:#fff;
  border:1px dashed var(--line);
  border-radius:18px;
  grid-column:1/-1
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:72px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20
}

.nav{
  background:none;
  color:#8d838d;
  font-size:10px;
  font-weight:700;
  text-align:center
}

.nav strong{
  display:block;
  font-size:20px;
  margin-bottom:2px
}

.nav.active{color:var(--pink)}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#20182066;
  z-index:30;
  align-items:flex-end
}

.sheet{
  width:min(520px,100%);
  background:#fff;
  border-radius:26px 26px 0 0;
  padding:20px;
  max-height:80vh;
  overflow:auto
}

.sheet h3{margin:0 0 14px}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
  font-size:13px
}

.row b{white-space:nowrap}

.close{
  float:right;
  background:#f5f0f3;
  border-radius:50%;
  width:32px;
  height:32px
}

.notice{
  font-size:10px;
  color:var(--muted);
  line-height:1.4;
  margin-top:12px
}

.auth-info{
  padding:12px;
  background:#fff8fb;
  border-radius:14px;
  margin-bottom:12px;
  font-size:13px
}

@media(min-width:700px){
  body{padding:20px}
  .app{
    border-radius:30px;
    box-shadow:0 0 60px #0000000c;
    overflow:hidden
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div>
      <div class="logo">Auvra<span>✦</span></div>
      <div class="tagline">Find your everyday.</div>
    </div>

    <div style="display:flex;gap:8px">
      <button class="icon-btn" onclick="showAuth()" aria-label="Account">👤</button>
      <button class="icon-btn" onclick="showWishlist()" aria-label="Wishlist">♡</button>
    </div>
  </div>

  <div class="search">
    🔎
    <input
      id="search"
      placeholder="Search products, brands & categories"
      oninput="renderProducts()"
    >
  </div>
</header>

<main>

<section class="hero">
  <h1>Shop smarter.<br>Choose your way.</h1>
  <p>
    Discover products from different stores, compare options
