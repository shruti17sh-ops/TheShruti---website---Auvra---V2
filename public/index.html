<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Auvra — Find your everyday</title><style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#17171c;--muted:#70707a;--line:#e9e9ef;--accent:#111827;--soft:#f0f1f5;--good:#087443}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.wrap{max-width:1120px;margin:auto;padding:0 16px 90px}header{position:sticky;top:0;z-index:10;background:#f7f7fbe8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}nav{height:64px;display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:auto;padding:0 16px}.brand{font-weight:900;font-size:25px;letter-spacing:-1px}.tag{display:block;font-size:11px;color:var(--muted);font-weight:650}.navbtn,.chip,.actions button,select{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:9px 12px;cursor:pointer}.hero{padding:30px 0 15px}.hero h1{font-size:clamp(32px,7vw,58px);line-height:1;letter-spacing:-2px;margin:0 0 12px}.hero p{color:var(--muted);line-height:1.55;max-width:680px}.search{display:flex;background:#fff;border:1px solid var(--line);padding:6px;border-radius:18px;box-shadow:0 8px 30px #0000000d}.search input{flex:1;min-width:0;border:0;outline:0;padding:11px;background:transparent}.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}.toolbar h2{font-size:20px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.pic{aspect-ratio:1.1;background:linear-gradient(135deg,#eef0f4,#fafafa);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}.heart{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:#ffffffe8;width:38px;height:38px;border-radius:50%;cursor:pointer}.body{padding:13px}.cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800}.name{font-weight:800;line-height:1.25;margin:6px 0}.rating{font-size:13px}.price{font-size:20px;font-weight:900;margin-top:8px}.old{text-decoration:line-through;color:#999;font-size:12px;margin-left:5px;font-weight:500}.save{color:var(--good);font-size:12px;font-weight:800}.stores{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.store{font-size:11px;background:var(--soft);border-radius:999px;padding:6px 8px}.actions{display:flex;gap:7px}.actions button{flex:1;font-weight:750}.actions .buy{background:var(--accent);color:#fff;border-color:var(--accent)}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}.bottomin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);padding:7px}.bottom button{border:0;background:none;padding:8px;color:var(--muted);cursor:pointer}.bottom b{display:block;color:var(--ink);font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:30;padding:18px;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;max-width:720px;width:100%;margin:auto;padding:18px;max-height:82vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;cursor:pointer}.offer{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);padding:12px;border-radius:16px;margin-top:10px}.offer small,.note{color:var(--muted)}.note{font-size:12px;line-height:1.5}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.bottom{display:none}.hero{padding-top:55px}}
</style></head><body><header><nav><div><div class="brand">Auvra</div><span class="tag">Find your everyday.</span></div><button class="navbtn" onclick="wishlist()">♡ Wishlist <span id="wc">0</span></button></nav></header><main class="wrap"><section class="hero"><h1>One place to compare.<br>Many ways to buy.</h1><p>Auvra helps you discover everyday products, compare options, and choose where to buy.</p><div class="search"><input id="q" placeholder="Search headphones, sneakers, skincare..." oninput="render()"><button class="primary" onclick="render()">Search</button></div><div class="chips" id="chips"></div></section><div class="toolbar"><h2 id="title">Popular on Auvra</h2><select id="sort" onchange="render()"><option value="rel">Relevance</option><option value="low">Price: low → high</option><option value="high">Price: high → low</option><option value="rating">Rating</option></select></div><div class="grid" id="grid"></div></main><div class="bottom"><div class="bottomin"><button onclick="scrollTo({top:0,behavior:'smooth'})">⌂<b>Home</b></button><button onclick="q.focus();scrollTo({top:0,behavior:'smooth'})">⌕<b>Search</b></button><button onclick="wishlist()">♡<b>Wishlist</b></button></div></div><div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><div class="sheethead"><h2 id="mt">Auvra</h2><button class="close" onclick="closeM()">×</button></div><div id="mb"></div></div></div>
<script>
const API_BASE='';const P=[
{id:1,n:'Wireless Noise-Cancel Headphones',c:'Electronics',i:'🎧',p:1999,o:2999,r:4.5,s:[['Amazon','https://www.amazon.in/s?k=wireless+noise+cancelling+headphones'],['Flipkart','https://www.flipkart.com/search?q=wireless+noise+cancelling+headphones']]},
{id:2,n:'Smart Fitness Watch',c:'Electronics',i:'⌚',p:1499,o:2199,r:4.3,s:[['Amazon','https://www.amazon.in/s?k=smart+fitness+watch'],['Flipkart','https://www.flipkart.com/search?q=smart+fitness+watch']]},
{id:3,n:'Everyday Comfort Sneakers',c:'Fashion',i:'👟',p:1299,o:1999,r:4.4,s:[['Myntra','https://www.myntra.com/sneakers'],['Flipkart','https://www.flipkart.com/search?q=everyday+sneakers']]},
{id:4,n:'Minimal Everyday Handbag',c:'Fashion',i:'👜',p:899,o:1499,r:4.6,s:[['Myntra','https://www.myntra.com/handbags'],['Amazon','https://www.amazon.in/s?k=everyday+handbag']]},
{id:5,n:'Smart LED Desk Lamp',c:'Home',i:'💡',p:799,o:1199,r:4.2,s:[['Amazon','https://www.amazon.in/s?k=smart+led+desk+lamp'],['Flipkart','https://www.flipkart.com/search?q=smart+led+desk+lamp']]},
{id:6,n:'Daily Skincare Starter Set',c:'Beauty',i:'🧴',p:699,o:999,r:4.5,s:[['Amazon','https://www.amazon.in/s?k=skincare+starter+set'],['Myntra','https://www.myntra.com/skin-care']]},
{id:7,n:'Lightweight College Backpack',c:'Fashion',i:'🎒',p:1099,o:1699,r:4.4,s:[['Amazon','https://www.amazon.in/s?k=college+backpack'],['Flipkart','https://www.flipkart.com/search?q=college+backpack']]},
{id:8,n:'Adjustable Home Workout Kit',c:'Fitness',i:'🏋️',p:1599,o:2299,r:4.3,s:[['Amazon','https://www.amazon.in/s?k=home+workout+kit'],['Flipkart','https://www.flipkart.com/search?q=home+workout+kit']]}
];let cat='All',w=JSON.parse(localStorage.getItem('auvra_w')||'[]');const ₹=n=>'₹'+n.toLocaleString('en-IN');
function render(){let qv=q.value.toLowerCase().trim(),cs=['All',...new Set(P.map(x=>x.c))];chips.innerHTML=cs.map(x=>`<button class="chip ${x===cat?'active':''}" onclick="cat='${x}';render()">${x}</button>`).join('');let a=P.filter(x=>(cat==='All'||x.c===cat)&&(!qv||(x.n+' '+x.c).toLowerCase().includes(qv)));let s=sort.value;a.sort((x,y)=>s==='low'?x.p-y.p:s==='high'?y.p-x.p:s==='rating'?y.r-x.r:0);title.textContent=qv?`${a.length} result${a.length===1?'':'s'}`:(cat==='All'?'Popular on Auvra':cat);grid.innerHTML=a.length?a.map(card).join(''):`<div class="empty">No products found. Try another search.</div>`;wc.textContent=w.length}
function card(x){let save=Math.round((1-x.p/x.o)*100);return `<article class="card"><div class="pic">${x.i}<button class="heart" onclick="toggle(${x.id})">${w.includes(x.id)?'♥':'♡'}</button></div><div class="body"><div class="cat">${x.c}</div><div class="name">${x.n}</div><div class="rating">★ ${x.r}</div><div class="price">${₹(x.p)} <span class="old">${₹(x.o)}</span></div><div class="save">${save}% below demo reference</div><div class="stores">${x.s.map(y=>`<span class="store">${y[0]}</span>`).join('')}</div><div class="actions"><button onclick="compare(${x.id})">Compare</button><button class="buy" onclick="compare(${x.id})">Buy options</button></div></div></article>`}
function toggle(id){w=w.includes(id)?w.filter(x=>x!==id):[...w,id];localStorage.setItem('auvra_w',JSON.stringify(w));render()}
function show(t,b){mt.textContent=t;mb.innerHTML=b;modal.classList.add('show')}function closeM(){modal.classList.remove('show')}
function compare(id){let x=P.find(a=>a.id===id);show(x.n,`<p class="note">Choose a retailer. When the backend is configured, Auvra requests a trackable affiliate link before redirecting.</p>${x.s.map((y,i)=>`<div class="offer"><div><b>${y[0]}</b><br><small>Retailer option</small></div><button class="primary" onclick="buy(${x.id},${i})">Go to ${y[0]}</button></div>`).join('')}<p class="note">Prices in this first MVP are sample comparison data. Live price/catalog feeds can be connected after retailer/network access is approved.</p>`)}
async function buy(id,i){let x=P.find(a=>a.id===id),url=x.s[i][1];try{let r=await fetch((API_BASE||'')+'/api/affiliate?url='+encodeURIComponent(url));if(r.ok){let d=await r.json();if(d.tracking_url){location.href=d.tracking_url;return}}}catch(e){}location.href=url}
function wishlist(){let a=P.filter(x=>w.includes(x.id));show('Your Wishlist',a.length?a.map(x=>`<div class="offer"><div><b>${x.n}</b><br><small>${₹(x.p)} · ★ ${x.r}</small></div><button class="primary" onclick="compare(${x.id})">Shop</button></div>`).join(''):'<p class="note">Your wishlist is empty. Tap ♡ on a product to save it.</p>')}
render();
</script></body></html>
